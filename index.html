<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>IPTV Player Pro</title>
    <style>
        body { background: #12141c; color: white; font-family: sans-serif; margin: 0; padding: 10px; }
        .container { max-width: 100%px; margin: auto; }
        
        #tabs-container, #nav-container { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 8px; }
        .tab-btn { background: #1a1e2a; border: 1px solid #444; color: #fff; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; white-space: nowrap; }
        .tab-btn.active { border-color: #e67e22; background: #262a39; }
        .btn-add { border: 1px dashed #e67e22; color: #e67e22; }
        
        #list-container { margin-top: 10px; }
        .grid-view { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        
        /* Genel Liste Kartı */
        .card { background: #1a1e2a; padding: 10px; margin: 6px 0; border-radius: 8px; border: 1px solid #333; cursor: pointer; display: flex; align-items: center; }
        
        /* Grid Poster Kartları */
        .grid-item { flex-direction: column; height: 250px; margin: 0; text-align: center; padding: 5px; overflow: hidden; }
        .card:hover { border-color: #e67e22; background: #222736; }
        
        /* Canlı TV Logoları - 35px Boyutunda */
        .card img { width: 35px; height: 35px; object-fit: contain; margin-right: 15px; padding: 3px; border-radius: 6px; background: #0b0c11; }
        
        /* Grid Posterler */
        .grid-item img { width: 100%; height: 180px; object-fit: cover; margin-bottom: 6px; border-radius: 6px; background: #000; }
        .grid-item span { font-size: 11px; line-height: 1.2; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 28px; }

        .search-wrapper { position: relative; width: 100%; margin-bottom: 12px; }
        #search-box { width: 100%; padding: 12px; background: #262a39; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; }
        #clear-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #ff4d4d; display: none; }
        
        #modal { display: none; position: fixed; top: 15%; left: 5%; width: 80%; background: #1a1e2a; padding: 20px; border-radius: 12px; border: 1px solid #444; z-index: 1000; }
        input { width: 100%; padding: 10px; margin: 5px 0; background: #12141c; border: 1px solid #333; color: white; border-radius: 6px; box-sizing: border-box; }
        .btn-save { background: #e67e22; width: 100%; padding: 10px; border:none; color:white; border-radius:6px; cursor:pointer; font-weight:bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="tabs-container">
        <button class="tab-btn btn-add" onclick="toggleModal()">+Panel Ekle</button>
 <button class="tab-btn active" onclick="setActivePanel({host:'http://eagleat.xyz:8080', user:'yKbGP2Ck', pass:'mB5ttuc'}, this)">Panel 1</button>       
<button class="tab-btn" onclick="setActivePanel({host:'http://v4-1.timsahplay.com:8080', user:'cH8JmEHrWS', pass:'rTKeHcSGZU'}, this)">Panel 2</button>
        <button class="tab-btn" onclick="setActivePanel({host:'http://nxbrid.xyz:80', user:'fehmi1983', pass:'1983fehmi'}, this)">Panel 3</button>
        <button class="tab-btn" onclick="setActivePanel({host:'http://elitetr2.xyz:80', user:'Msisman8054', pass:'Nh2BxOyoVu'}, this)">Panel 4</button>
        <button class="tab-btn" onclick="setActivePanel({host:'http://hlmtv.shop:8080', user:'yilmazkoc', pass:'jIKnx4pVSE'}, this)">Panel 5</button>
        <button class="tab-btn" onclick="setActivePanel({host:'http://nx8417xs.xyz:80', user:'Ahmet.DURMUss', pass:'np2X.sHqXca'}, this)">Panel 6</button>
        <button class="tab-btn" onclick="setActivePanel({host:'http://webtv5.xyz:8080', user:'onursako', pass:'9DB8372K'}, this)">Panel 7</button>
<button class="tab-btn" onclick="setActivePanel({host:'http://nrvmobil.com:2095',user:'filizilboga2021', pass:'xbs3Dbwjfs'}, this)">Panel 8</button>
<button class="tab-btn" onclick="setActivePanel({host:'http://v2.iptvspor.de:8080',user:'3yVozxPg', pass:'bMf6Qxwe'}, this)">Panel 9</button>
</div>

    <div id="nav-container">
        <button class="tab-btn active" onclick="loadContent('live')">📺 CANLI TV</button>
        <button class="tab-btn" onclick="loadContent('vod')">🎬 FİLMLER</button>
        <button class="tab-btn" onclick="loadContent('series')">📺 DİZİLER</button>
    </div>

    <div class="search-wrapper">
        <input type="text" id="search-box" placeholder="Ara..." oninput="filterList()">
        <span id="clear-btn" onclick="clearSearch()">✕</span>
    </div>

    <div id="modal">
        <input type="text" id="pName" placeholder="Panel Adı">
        <input type="text" id="pHost" placeholder="Host (http://...)">
        <input type="text" id="pUser" placeholder="Kullanıcı">
        <input type="password" id="pPass" placeholder="Şifre">
        <button class="btn-save" onclick="savePanel()">KAYDET</button>
    </div>

    <div id="list-container"></div>
</div>

<script>
    let activeCfg = {host:"http://v4-1.timsahplay.com:8080", user:"MnLJuWYjKH", pass:"cRqVVE6HSp"};
    let currentType = 'live';
    const forbiddenKeywords = ['xxx', 'adult', 'erotik', 'porno', 'sex', 'hot'];

    window.onload = () => {
        const savedPanels = JSON.parse(localStorage.getItem('myPanels') || '[]');
        savedPanels.forEach(p => createDynamicButton(p.name, p.cfg));
        loadContent('live');
    };

    function toggleModal() { const m = document.getElementById('modal'); m.style.display = (m.style.display === 'block') ? 'none' : 'block'; }
    function clearSearch() { document.getElementById('search-box').value = ''; filterList(); }
    
    function filterList() {
        const term = document.getElementById('search-box').value.toLowerCase();
        document.getElementById('clear-btn').style.display = term.length > 0 ? 'block' : 'none';
        document.querySelectorAll('.card').forEach(c => {
            if(c.dataset.back) return;
            c.style.display = c.innerText.toLowerCase().includes(term) ? 'flex' : 'none';
        });
    }

    function renderList(items, callback, backAction = null, isGrid = false, showLogos = false) {
        const cont = document.getElementById('list-container');
        cont.innerHTML = "";
        cont.className = isGrid ? "grid-view" : "";
        
        if(backAction) {
            let b = document.createElement('div');
            b.className = 'card'; b.style.gridColumn = isGrid ? "span 3" : "none"; b.innerText = "⬅ Geri Dön"; b.dataset.back = "true";
            b.onclick = backAction;
            cont.appendChild(b);
        }
        items.forEach(item => {
            const name = (item.name || item.title || item.category_name || "").toLowerCase();
            if (forbiddenKeywords.some(kw => name.includes(kw))) return;

            let d = document.createElement('div');
            d.className = isGrid ? 'card grid-item' : 'card';
            
            if (showLogos && (item.stream_icon || item.cover)) {
                d.innerHTML = `<img src="${item.stream_icon || item.cover}" onerror="this.style.display='none'"> <span>${item.name || item.title || item.category_name}</span>`;
            } else {
                d.innerText = item.name || item.title || item.category_name || "İsimsiz";
            }
            d.onclick = () => callback(item);
            cont.appendChild(d);
        });
    }

    function savePanel() {
        const n = document.getElementById('pName').value, h = document.getElementById('pHost').value, u = document.getElementById('pUser').value, p = document.getElementById('pPass').value;
        if(!n || !h) return alert("İsim ve Host zorunludur!");
        const cfg = { host: h.replace(/\/$/, ""), user: u, pass: p };
        createDynamicButton(n, cfg);
        const savedPanels = JSON.parse(localStorage.getItem('myPanels') || '[]');
        savedPanels.push({name: n, cfg: cfg});
        localStorage.setItem('myPanels', JSON.stringify(savedPanels));
        toggleModal();
    }

    function createDynamicButton(name, cfg) {
        let b = document.createElement('button');
        b.className = 'tab-btn';
        b.innerHTML = `${name} <span onclick="deletePanel(event, '${name}')" style="color:red; margin-left:5px">×</span>`;
        b.onclick = () => setActivePanel(cfg, b);
        document.getElementById('tabs-container').appendChild(b);
    }

    function deletePanel(event, name) {
        event.stopPropagation();
        if(confirm(name + " panelini silmek istediğinize emin misiniz?")) {
            event.target.parentElement.remove();
            let savedPanels = JSON.parse(localStorage.getItem('myPanels') || '[]');
            savedPanels = savedPanels.filter(p => p.name !== name);
            localStorage.setItem('myPanels', JSON.stringify(savedPanels));
        }
    }

    function setActivePanel(cfg, btn) {
        activeCfg = cfg;
        document.querySelectorAll('#tabs-container .tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadContent(currentType);
    }

    async function loadContent(type) {
        currentType = type;
        const action = type === 'live' ? 'get_live_categories' : (type === 'vod' ? 'get_vod_categories' : 'get_series_categories');
        const res = await fetch(`${activeCfg.host}/player_api.php?username=${activeCfg.user}&password=${activeCfg.pass}&action=${action}`);
        renderList(await res.json(), (cat) => type === 'series' ? getSeriesList(cat.category_id) : showStreams(cat.category_id, type));
    }

    async function showStreams(catId, type) {
        const res = await fetch(`${activeCfg.host}/player_api.php?username=${activeCfg.user}&password=${activeCfg.pass}&action=${type === 'live' ? 'get_live_streams' : 'get_vod_streams'}&category_id=${catId}`);
        const data = await res.json();
        renderList(data, (it) => window.open(`${activeCfg.host}/${type === 'live' ? 'live' : 'movie'}/${activeCfg.user}/${activeCfg.pass}/${it.stream_id}.${it.container_extension || 'm3u8'}`, '_blank'), () => loadContent(type), (type === 'vod'), true);
    }

    async function getSeriesList(catId) {
        const res = await fetch(`${activeCfg.host}/player_api.php?username=${activeCfg.user}&password=${activeCfg.pass}&action=get_series&category_id=${catId}`);
        renderList(await res.json(), (it) => getSeriesInfo(it.series_id, catId), () => loadContent('series'), true, true);
    }

    async function getSeriesInfo(sId, catId) {
        const res = await fetch(`${activeCfg.host}/player_api.php?username=${activeCfg.user}&password=${activeCfg.pass}&action=get_series_info&series_id=${sId}`);
        const data = await res.json();
        const seasons = Object.keys(data.episodes).map(sNum => ({ name: `Sezon ${sNum}`, season_number: sNum }));
        renderList(seasons, (s) => showEpisodes(data.episodes[s.season_number], () => getSeriesInfo(sId, catId)), () => getSeriesList(catId), false, false);
    }

    function showEpisodes(episodes, backFn) {
        renderList(episodes, (ep) => window.open(`${activeCfg.host}/series/${activeCfg.user}/${activeCfg.pass}/${ep.id}.${ep.container_extension || 'm3u8'}`, '_blank'), backFn, false, true);
    }
</script>
</body>
</html>
